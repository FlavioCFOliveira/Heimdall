(adapter layer only).
"""

[[audits.webpki-root-certs]]
criteria = "safe-to-deploy"
version = "1.0.7"
notes = """
webpki-root-certs 1.0.7 reviewed by Heimdall maintainer (@flaviocfo, 2026-05-10).
Mozilla's IncludedCACertificateReportPEMCSV bundled as a Rust constant.  Pure
Rust; no unsafe; no build script.  Used by the forwarder + ADoT outbound
certificate-validation path (SEC-* outbound posture).  Treated as
does-not-implement-crypto (data only).  The upstream bundle is the same one
shipped by curl, Ruby's openssl gem, and the Mozilla CA programme — a single
external source-of-truth audited by the Mozilla CA team.
"""


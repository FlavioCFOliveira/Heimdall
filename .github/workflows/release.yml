# Tier 4 CI — release gates
# Implements ENG-072..075 and ENG-176 in specification/010-engineering-policies.md.
# Triggered only on version tags (vMAJOR.MINOR.PATCH or pre-release variants).
# Every Tier 1, Tier 2, and Tier 3 check MUST be green before this workflow
# is expected to produce a publishable artefact.
#
# Sprint 49 task #501: the conformance-gate job in ci-tier3.yml is a required
# Tier 3 check.  The tier-gate job below explicitly queries the GitHub API for
# the most recent Tier 3 nightly run and refuses to proceed if the
# conformance-vectors job did not succeed — see "Verify Tier 3 conformance gate".
#
# Build matrix (ENV-015, ENV-017, ENV-021, ENV-045, ENV-047):
#   Linux x86_64-musl   → ubuntu-latest         (GitHub-hosted, native)
#   Linux aarch64-musl  → ubuntu-24.04-arm       (GitHub-hosted, native ARM64)
#   Linux riscv64-gnu   → [self-hosted,linux,riscv64]  (dedicated runner, ENV-047)
#   macOS aarch64       → macos-latest           (dev-only, ENV-010/ENV-017)
#   macOS x86_64        → macos-13               (dev-only, ENV-010/ENV-017)
#
# Cross-compilation via `cross` is forbidden for official release artefacts
# (ENV-047); all binaries are native builds on the appropriate runner.
# Experimental entries (riscv64) use continue-on-error and self-hosted runners.
# riscv64 is the Intermediate-tier release artefact per ENV-071 in
# specification/009-target-environment.md and does not block the release gate;
# promotion criteria are listed in ENV-072 and the governing decision is
# recorded in ADR-0068 (docs/adr/0068-riscv64-tier-policy.md).

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ── ENG-079..082: strictly verify Tier 1 + 2 + 3 green on the tagged commit ─
  # #666 (Sprint 64): no advisory mode. The job queries the GitHub Actions API
  # for runs whose head_sha equals the tagged commit, asserts the workflow run
  # exists and concluded with `success`, and asserts every required job inside
  # the run completed with `success`.
  #
  # If no run is found for the tagged commit, OR the run did not finish, OR a
  # required job is missing/failed/cancelled, the gate fails and the release is
  # blocked. The reasoning: a tag is only valid after all three tiers have run
  # green against the exact commit being tagged — anything weaker permits a
  # signed artefact to ship without a verifiable gate.
  #
  # The Tier-3 nightly window: a nightly Tier 3 run from a few days ago is NOT
  # a valid gate for a brand-new tag. The release engineer must trigger a
  # workflow_dispatch run of ci-tier3.yml against the tagged commit before
  # pushing the tag, OR push the tag onto a branch whose Tier 3 run is in the
  # configured retention window (≤ 7 days; verified below).
  tier-gate:
    name: tier gate check
    runs-on: ubuntu-latest
    permissions:
      actions: read  # Required to query workflow run statuses via GitHub API.
    env:
      # Required jobs per tier (ENG-072, ENG-079..082, Sprint-49 #501,
      # Sprint-64 #666). Names must match the job IDs in ci-tier{1,2,3}.yml.
      REQUIRED_TIER1_JOBS: "build,test-linux,test-macos,fmt,clippy,deny,audit,vet,doc,docs-spec-sync,docs-freeze,commit-lint,smoke-binary"
      REQUIRED_TIER2_JOBS: "proptest-smoke,fuzz-smoke,loom,bench-regression"
      REQUIRED_TIER3_JOBS: "miri,fuzz-extended,oss-fuzz-criteria,proptest-large,bench-comparison,repro-build,conformance-vectors,conformance-golden,conformance-interop,conformance-gate"
      # Maximum age of a Tier 3 run accepted as a gate, in seconds (7 days).
      TIER3_RUN_MAX_AGE_SECS: "604800"
    steps:
      - uses: actions/checkout@v6
      - name: Strict Tier 1+2+3 gate against tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "=== Tier 4 gate (#666, ENG-079..082) ==="
          echo "Tag:        ${REF_NAME}"
          echo "Commit:     ${TAG_SHA}"
          echo "Repository: ${REPO}"
          echo ""

          # ── Helper: assert a workflow run for the tagged commit exists,
          #            concluded successfully, and contains every required job.
          assert_tier_run() {
            local workflow="$1"
            local required_csv="$2"
            local max_age_secs="${3:-0}"
            echo "── Tier check: ${workflow} ──"
            local run_json
            run_json=$(gh api "/repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=${TAG_SHA}&per_page=10" --jq '.workflow_runs[0] | select(. != null) | {id, conclusion, status, created_at}' 2>/dev/null || echo "")
            if [ -z "${run_json}" ]; then
              echo "::error::No ${workflow} run found for commit ${TAG_SHA}. Trigger a workflow_dispatch run against the tagged commit before pushing the tag."
              return 1
            fi
            local run_id conclusion status created_at
            run_id=$(echo "${run_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            conclusion=$(echo "${run_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')
            status=$(echo "${run_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")')
            created_at=$(echo "${run_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("created_at") or "")')
            echo "  run_id:     ${run_id}"
            echo "  status:     ${status}"
            echo "  conclusion: ${conclusion}"
            echo "  created_at: ${created_at}"
            if [ "${status}" != "completed" ]; then
              echo "::error::${workflow} run ${run_id} is not completed (status=${status}). Wait for the run to finish before tagging."
              return 1
            fi
            if [ "${conclusion}" != "success" ]; then
              echo "::error::${workflow} run ${run_id} concluded ${conclusion}. Tier 4 requires success."
              return 1
            fi
            if [ "${max_age_secs}" -gt 0 ]; then
              local age
              age=$(python3 -c "import datetime; c=datetime.datetime.fromisoformat('${created_at}'.replace('Z','+00:00')); n=datetime.datetime.now(datetime.timezone.utc); print(int((n-c).total_seconds()))")
              if [ "${age}" -gt "${max_age_secs}" ]; then
                echo "::error::${workflow} run ${run_id} is ${age}s old, exceeding ${max_age_secs}s. Re-run before tagging."
                return 1
              fi
            fi
            local jobs_json
            jobs_json=$(gh api "/repos/${REPO}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs')
            local missing=0
            IFS=',' read -ra REQUIRED <<< "${required_csv}"
            for job in "${REQUIRED[@]}"; do
              local found
              found=$(echo "${jobs_json}" | python3 -c "import json,sys; jobs=json.load(sys.stdin); t=sys.argv[1]; m=next((j for j in jobs if j.get('name')==t or j.get('name','').startswith(t+' ')), None); print((m or {}).get('conclusion') or 'missing')" "${job}")
              if [ "${found}" = "success" ]; then
                echo "    ${job}: success"
              elif [ "${found}" = "skipped" ]; then
                echo "::error::Required ${workflow} job '${job}' was SKIPPED — release blocked."
                missing=$((missing + 1))
              elif [ "${found}" = "missing" ]; then
                echo "::error::Required ${workflow} job '${job}' MISSING from run ${run_id} — release blocked."
                missing=$((missing + 1))
              else
                echo "::error::Required ${workflow} job '${job}' concluded ${found} — release blocked."
                missing=$((missing + 1))
              fi
            done
            if [ "${missing}" -gt 0 ]; then
              return 1
            fi
            echo "  ${workflow}: all ${#REQUIRED[@]} required jobs green."
          }

          assert_tier_run "ci-tier1.yml" "${REQUIRED_TIER1_JOBS}"
          echo ""
          assert_tier_run "ci-tier2.yml" "${REQUIRED_TIER2_JOBS}"
          echo ""
          assert_tier_run "ci-tier3.yml" "${REQUIRED_TIER3_JOBS}" "${TIER3_RUN_MAX_AGE_SECS}"
          echo ""
          echo "Tier 4 gate: PASS — all three tiers green on commit ${TAG_SHA}."

  # ── Build matrix (ENV-015, ENV-017, ENV-021, ENV-024, ENV-045, ENV-047) ──
  # All Linux artefacts are produced by native builds on the appropriate runner.
  # musl targets are linked via musl-gcc installed from the distro's musl-tools
  # package; no cross-compilation toolchain is used.
  build:
    name: build (${{ matrix.target }})
    needs: tier-gate
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 static musl — GitHub-hosted native (ENV-024) ──────
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            install-musl: true
            strip: true
            experimental: false
          # ── Linux aarch64 static musl — GitHub-hosted ARM64 (ENV-024/047) ──
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install-musl: true
            strip: true
            experimental: false
          # ── Linux riscv64 glibc — self-hosted runner (ENV-024/045/047) ─────
          # experimental: true until the dedicated riscv64 runner is provisioned.
          - runner: [self-hosted, linux, riscv64]
            target: riscv64gc-unknown-linux-gnu
            install-musl: false
            strip: true
            experimental: true
          # ── macOS aarch64 — development-only (ENV-010, ENV-017) ─────────────
          - runner: macos-latest
            target: aarch64-apple-darwin
            install-musl: false
            strip: false
            experimental: false
          # ── macOS x86_64 — development-only (ENV-010, ENV-017) ──────────────
          - runner: macos-13
            target: x86_64-apple-darwin
            install-musl: false
            strip: false
            experimental: false
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Install musl-tools (musl targets only)
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Configure musl linker (musl targets only)
        if: matrix.install-musl
        run: |
          # Derive the CARGO_TARGET_*_LINKER env-var name from the target triple.
          # Example: aarch64-unknown-linux-musl → AARCH64_UNKNOWN_LINUX_MUSL
          TARGET_VAR="$(echo '${{ matrix.target }}' | tr '[:lower:].-' '[:upper:]__')_LINKER"
          echo "CARGO_TARGET_${TARGET_VAR}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}

      - name: Strip binary (Linux targets)
        if: matrix.strip
        run: strip target/${{ matrix.target }}/release/heimdall || true

      - name: Stage binary with release name
        run: |
          src="target/${{ matrix.target }}/release/heimdall"
          dst="heimdall-${{ github.ref_name }}-${{ matrix.target }}"
          cp "$src" "$dst"
          echo "BINARY=$dst" >> "$GITHUB_ENV"

      - name: Upload binary artefact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY }}
          path: ${{ env.BINARY }}

  # ── Collect SHA-256 hashes for SLSA provenance subjects ──────────────────
  # Downloads all successfully built binaries and computes their SHA-256
  # hashes, encoded as base64 for the SLSA generator_generic_slsa3 workflow.
  hash:
    name: collect hashes
    needs: build
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Download all binary artefacts
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          merge-multiple: true
          pattern: "heimdall-*"

      - name: Compute SHA-256 hashes
        id: hash
        run: |
          cd artefacts/
          sha256sum heimdall-* | sort > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 -w0 < SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS-binaries
          path: artefacts/SHA256SUMS

  # ── ENG-073: artefact signing (sigstore / cosign) ─────────────────────────
  # Signs every release binary with cosign (keyless, OIDC-backed sigstore
  # transparency log) as required by THREAT-013.
  sign:
    name: sign artefacts
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC token used by cosign keyless signing.
      contents: write   # Required to upload signatures to the GitHub release.
    steps:
      - uses: actions/checkout@v6
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artefacts/
          merge-multiple: true
          pattern: "heimdall-*"
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign all binaries (keyless / OIDC)
        run: |
          for f in artefacts/heimdall-*; do
            echo "Signing $f..."
            cosign sign-blob --yes "$f" \
              --bundle "${f}.cosign.bundle"
          done
      - name: Upload signatures
        uses: actions/upload-artifact@v7
        with:
          name: signatures-${{ github.ref_name }}
          path: artefacts/*.cosign.bundle

  # ── ENG-074: SBOM publication ─────────────────────────────────────────────
  # Generates and attaches a CycloneDX SBOM to the release (THREAT-014,
  # ADR-0056).  Signs the SBOM with cosign.
  sbom:
    name: SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # For cosign SBOM signing.
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: sbom
      - name: Install cargo-cyclonedx + cosign
        run: cargo install cargo-cyclonedx --locked
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          cargo cyclonedx --format json \
            --output-file "sbom-${{ github.ref_name }}.cdx.json"
      - name: Sign SBOM with cosign
        run: |
          cosign sign-blob --yes "sbom-${{ github.ref_name }}.cdx.json" \
            --bundle "sbom-${{ github.ref_name }}.cdx.json.cosign.bundle"
      - name: Upload SBOM + signature artefact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            sbom-${{ github.ref_name }}.cdx.json
            sbom-${{ github.ref_name }}.cdx.json.cosign.bundle

  # ── SLSA Level 3 provenance (ADR-0058) ───────────────────────────────────
  # Generates platform-signed build provenance using slsa-github-generator.
  # SHA-256 hashes are collected by the `hash` job above and passed as the
  # provenance subjects, enabling consumers to verify each binary's integrity.
  provenance:
    name: SLSA provenance
    needs: hash
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hash.outputs.hashes }}
      upload-assets: true

  # ── Verification on clean runner ──────────────────────────────────────────
  # Re-downloads signed artefacts on a fresh runner and verifies every
  # binary has a valid cosign bundle.  Tier 4 fails if any artefact lacks
  # a signature or SBOM (ENV-030).
  verify:
    name: verify signatures + SBOM
    needs: [sign, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          path: verify-artefacts/
          merge-multiple: true
      - name: Verify every binary has a cosign bundle
        run: |
          missing=0
          for f in verify-artefacts/heimdall-*; do
            [[ "$f" == *.cosign.bundle ]] && continue
            bundle="${f}.cosign.bundle"
            if [ ! -f "$bundle" ]; then
              echo "MISSING SIGNATURE: $f" >&2
              missing=$((missing+1))
            else
              echo "OK: $(basename "$f") → $(basename "$bundle")"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Tier 4 FAILURE: $missing artefact(s) lack cosign bundles" >&2
            exit 1
          fi
      - name: Verify SBOM present and signed
        run: |
          sbom="verify-artefacts/sbom-${{ github.ref_name }}.cdx.json"
          bundle="${sbom}.cosign.bundle"
          if [ ! -f "$sbom" ]; then
            echo "Tier 4 FAILURE: SBOM not found" >&2
            exit 1
          fi
          if [ ! -f "$bundle" ]; then
            echo "Tier 4 FAILURE: SBOM cosign bundle not found" >&2
            exit 1
          fi
          echo "SBOM and signature present: OK"

  # ── ENG-075: GitHub Release with MSRV in release notes ───────────────────
  # Creates the GitHub Release, attaches signed binaries, signatures, SBOM,
  # and SLSA provenance.  Ensures the release notes state the MSRV.
  publish:
    name: publish release
    needs: [verify, sbom, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(grep '^rust-version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "MSRV=$msrv" >> "$GITHUB_OUTPUT"
      - name: Download all release artefacts
        uses: actions/download-artifact@v8
        with:
          path: release-artefacts/
          merge-multiple: true
      - name: Assert no binary is missing a signature
        run: |
          missing=0
          for f in release-artefacts/heimdall-*; do
            [[ "$f" == *.cosign.bundle ]] && continue
            if [ ! -f "${f}.cosign.bundle" ]; then
              echo "MISSING: ${f}.cosign.bundle" >&2
              missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || { echo "Blocking publish: unsigned artefacts" >&2; exit 1; }
      - name: List artefacts
        run: ls -lh release-artefacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artefacts/**
          body: |
            ## Heimdall ${{ github.ref_name }}

            **Minimum Supported Rust Version (MSRV): ${{ steps.msrv.outputs.MSRV }}**

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for the full list of changes in this release.

            ### Distribution artefacts

            | Target | Platform | Notes |
            |--------|----------|-------|
            | `x86_64-unknown-linux-musl` | Linux x86\_64 (static musl) | ENV-024 |
            | `aarch64-unknown-linux-musl` | Linux aarch64 (static musl) | ENV-024 |
            | `riscv64gc-unknown-linux-gnu` | Linux riscv64 (glibc) | ENV-024/022 |
            | `aarch64-apple-darwin` | macOS Apple Silicon (dev only) | ENV-010/017 |
            | `x86_64-apple-darwin` | macOS Intel (dev only) | ENV-010/017 |

            All Linux binaries are produced by **native builds** on dedicated runners
            per ENV-047 (no cross-compilation for official artefacts).
            Container image: `ghcr.io/${{ github.repository_owner }}/heimdall:${{ github.ref_name }}`

            ### Artefact verification

            Release binaries are signed with [cosign](https://github.com/sigstore/cosign)
            using keyless OIDC signing backed by the Sigstore transparency log.
            Each binary ships with a `.cosign.bundle` file; verify with:

            ```sh
            cosign verify-blob \
              --bundle heimdall-${{ github.ref_name }}-<target>.cosign.bundle \
              heimdall-${{ github.ref_name }}-<target>
            ```

            SLSA Level 3 build provenance (`multiple.intoto.jsonl`) is attached.
            Verify with:

            ```sh
            slsa-verifier verify-artifact \
              heimdall-${{ github.ref_name }}-<target> \
              --provenance-path multiple.intoto.jsonl \
              --source-uri github.com/${{ github.repository }} \
              --source-tag ${{ github.ref_name }}
            ```

            A signed CycloneDX Software Bill of Materials
            (`sbom-${{ github.ref_name }}.cdx.json`) is included per THREAT-014.
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

[package]
name = "heimdall-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Performance validation harness and CI regression tooling for Heimdall."

[[bench]]
name = "allocator"
harness = false

[[bench]]
name = "dns_core"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "admission"
harness = false

[[bench]]
name = "rpz"
harness = false

[[bench]]
# UDP SO_REUSEPORT fan-out scaling bench (BIN-058, Sprint 67 task #676).
# Linux-only; cfg-gated to compile to nothing on other targets so cargo bench
# still works there without a separate invocation.
name = "udp_reuseport"
harness = false

[[bin]]
name = "heimdall-bench-compare"
path = "src/main.rs"

[features]
default = []
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
# Enable dhat heap profiler for allocation profiling (task #508, PERF-014).
# Build with: cargo bench -p heimdall-bench --features dhat-heap
# Output: dhat-heap.json (open with https://nnethercote.github.io/dh_view/)
dhat-heap = ["dep:dhat"]

[dependencies]
heimdall-core = { path = "../heimdall-core", version = "1.1.0" }
heimdall-runtime = { path = "../heimdall-runtime", version = "1.1.0" }
heimdall-roles = { path = "../heimdall-roles", version = "1.1.0" }
criterion = { version = "0.5", features = ["html_reports"] }

# Optional allocators (same flags as the heimdall binary crate, ADR-0062).
mimalloc = { version = "0.1", default-features = false, optional = true }
tikv-jemallocator = { version = "0.6", optional = true }

# Optional: dhat heap profiler for allocation-budget tracking (PERF-008).
dhat = { version = "0.3", optional = true }

# tokio — required for the udp_reuseport bench scenario (BIN-058).
# `rt-multi-thread` and `net` are the smallest feature set that drives the
# UdpListener bench loop; the daemon's own Cargo dep enables `full` already.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

[lints]
workspace = true

# cargo-deny configuration
# Per ENG-096 and ENG-192 in specification/010-engineering-policies.md.

[graph]
targets = []

# ── Advisories ──────────────────────────────────────────────────────────────
# Default advisory handling: deny all. Exceptions require an explicit entry
# in the `ignore` list, per ENG-051 and ENG-192.
#
# Waiver policy (ENG-051):
#   Every ignore entry MUST carry the following fields as inline comments:
#     - advisory ID (RUSTSEC-YYYY-NNNN)
#     - reason: why this advisory does not apply to Heimdall
#     - expires: ISO 8601 date (max 90 days from the date the waiver was added)
#     - reviewer: GitHub handle of the maintainer who approved the waiver
#
#   CI re-evaluates expiry on every run; an expired entry re-blocks Tier 1.
#   No advisory may be suppressed indefinitely. Waivers must be renewed or
#   resolved before their expiry date.
#
#   Example entry format:
#
#     [[advisories.ignore]]
#     id = "RUSTSEC-2024-XXXX"
#     # reason: the vulnerable feature (foo::bar) is not reachable from Heimdall
#     # expires: 2026-07-27
#     # reviewer: @flaviocfo
#
# Monthly advisory report:
#   The Tier 3 nightly pipeline generates a report of all active waivers and
#   their expiry dates, attached to the run summary for maintainer review.
[advisories]
version = 2
# Sprint 68 task #686 closed the only active waiver. The migration to
# rustls-pki-types' built-in PEM utilities removes rustls-pemfile from the
# dependency graph entirely; RUSTSEC-2025-0134 no longer applies.
ignore = []

# ── Licenses ────────────────────────────────────────────────────────────────
# Whitelist: ENG-094.  Only these SPDX identifiers are accepted.
# Blocklist: ENG-095.  Any unlisted licence causes a hard CI failure at Tier 1.
# Copyleft licences (GPL, LGPL, AGPL) are categorically excluded to protect
# Heimdall's MIT licence and operator distribution rights.
[licenses]
version = 2
# ENG-094 whitelist — permissive and weak-copyleft licences acceptable for a
# MIT-licenced server binary distributed to operators.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",              # icu_* crates (idna_adapter dependency tree)
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",      # webpki-root-certs (Mozilla CA bundle data)
    "OpenSSL",                  # ring / BoringSSL heritage (non-copyleft)
]
# ENG-095: copyleft and proprietary licences are blocked implicitly — the
# `allow` whitelist above is exhaustive, and any licence absent from it causes
# a hard CI failure at Tier 1.  cargo-deny removed the standalone `[licenses]
# deny` key (see EmbarkStudios/cargo-deny#611): the policy is now expressed by
# omission from `allow`.  Copyleft families that must remain blocked even if
# they appear via dual licensing (GPL/LGPL/AGPL/EUPL/SSPL/BSL/Commons-Clause)
# remain unlisted in `allow` and are therefore denied.
# Packages whose licence files cannot be automatically detected must be
# explicitly listed here with a justification and the correct SPDX expression.
exceptions = []
# Confidence threshold: cargo-deny must match the licence with at least 90%
# confidence; lower-confidence matches require a manual exception above.
confidence-threshold = 0.9

# ── Bans ────────────────────────────────────────────────────────────────────
# Per ENG-192: one active version per crate; wildcard dependencies denied.
# Explicit exceptions for unavoidable version conflicts must be listed in
# `skip` with an inline comment explaining the conflict and the resolution plan.
[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path-only dependencies between workspace members (e.g. `heimdall-core =
# { path = "../heimdall-core" }`) carry no `version` field and would otherwise
# be rejected as wildcards. Workspace-internal path edges are always
# resolved by Cargo to the in-tree crate version (`workspace.package.version`)
# and never reach crates.io, so the wildcard concern (uncontrolled upstream
# upgrades) does not apply. `allow-wildcard-paths = true` enables this carve-out
# while preserving the deny on registry-sourced wildcard versions.
allow-wildcard-paths = true
deny = []
# skip: transitive dependencies whose multi-version presence is dictated by
# upstream MSRV/feature constraints and cannot be unified by anything Heimdall
# does. Each entry below names a crate whose Cargo.lock today carries more than
# one resolved version solely because at least two upstream crates pin
# incompatible majors. The set is reviewed every release; an entry stays only
# while a resolver-level deduplication is impossible.
skip = [
    # Older `bollard` / `testcontainers` dependency edges still pin thiserror
    # v1.x while the rest of the tree (and our own crates) is on v2.x. Removing
    # this entry requires either dropping bollard or waiting for the testcontainers
    # ecosystem to migrate to thiserror 2.
    { crate = "thiserror" },
    { crate = "thiserror-impl" },
    # Multiple `rand` majors are pinned across the dependency tree:
    # criterion/quinn-proto/proptest/etc. each track a different major to honour
    # their own MSRV windows. cargo's resolver cannot unify them.
    { crate = "rand" },
    { crate = "rand_chacha" },
    { crate = "rand_core" },
    # `getrandom` follows `rand_core` — three majors coexist for the same MSRV
    # reason. Unification would require every transitive consumer to upgrade
    # in lockstep.
    { crate = "getrandom" },
    # `itertools` major mismatches between criterion (0.10), tonic (0.14),
    # and other utility crates.
    { crate = "itertools" },
    # `rustc-hash` 1.x and 2.x are both still on crates.io and are pulled by
    # different ecosystem branches.
    { crate = "rustc-hash" },
    # `socket2` 0.5 vs 0.6 split: tokio 1.x still uses 0.5; quinn-udp uses 0.6.
    { crate = "socket2" },
    # The Windows backend crates ship in coordinated families. Multiple majors
    # of `windows-sys`, `windows-targets`, and the per-target sub-crates coexist
    # because individual upstream crates pin different versions of the family.
    # Heimdall does not target Windows directly (Windows is excluded from the
    # supported platform set in spec 009), but the lockfile still resolves
    # these crates on Linux/macOS hosts; they are skipped collectively as a
    # bookkeeping matter.
    { crate = "windows-sys" },
    { crate = "windows-targets" },
    { crate = "windows_aarch64_gnullvm" },
    { crate = "windows_aarch64_msvc" },
    { crate = "windows_i686_gnu" },
    { crate = "windows_i686_msvc" },
    { crate = "windows_x86_64_gnu" },
    { crate = "windows_x86_64_gnullvm" },
    { crate = "windows_x86_64_msvc" },
    # `r-efi` is pulled by getrandom for UEFI targets; coexists in two majors.
    { crate = "r-efi" },
    # `wit-bindgen` is pulled by getrandom for wasi targets; coexists in two majors.
    { crate = "wit-bindgen" },
]
skip-tree = []

# ── Sources ──────────────────────────────────────────────────────────────────
# Per ENG-192: restrict to crates.io plus explicitly approved git sources.
# Adding a git source requires: (a) an ADR or tracked issue, (b) an entry in
# allow-git below, and (c) a cargo-vet audit entry.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# allow-git: no git-sourced dependencies are currently approved.
# To add one: open a tracking issue, obtain ADR approval, and add an entry here
# with a comment citing the issue number and the reason crates.io is not usable.
allow-git = []

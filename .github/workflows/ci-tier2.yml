# Tier 2 CI — per-pull-request slow gates
# Implements ENG-054..057 in specification/010-engineering-policies.md.
# Target: ≤30 minutes end-to-end wall-clock on hosted runners.
# All checks must pass before a PR is eligible for merge (ENG-156).

name: CI Tier 2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # ── ENG-054: proptest smoke runs ──────────────────────────────────────────
  # Bounded case count appropriate for per-PR budget.
  # Large-budget runs (10^6 cases) are in Tier 3.
  proptest-smoke:
    name: proptest smoke
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 256
    # E2E tests pulled in by the workspace test invocation need Redis even
    # when filtered by the `proptest` test-name selector — cargo still
    # COMPILES every target, and any test binary that depends on the daemon
    # boot path can panic on collection if Redis is unreachable. Attaching
    # the service is the simplest robust fix.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
      - name: cargo test (proptest, bounded)
        # Sprint 68 task #685: the harness's `reserve_loopback_pair()` now
        # serialises the daemon-spawn window via a file lock plus an
        # in-process refcounted Mutex, so per-binary parallelism is safe.
        # The previous `--test-threads=1` constraint is no longer required
        # for this tier; restore intra-binary parallelism for faster CI.
        # See docs/process/test-conventions.md.
        run: cargo test --locked -- --include-ignored proptest

  # ── ENG-055: cargo-fuzz smoke (60 s per target, ENG-209) ─────────────────
  # Each fuzz target runs for 60 seconds to catch trivial regressions.
  # Requires nightly rustc for libfuzzer instrumentation.
  #
  # Time budget (rmp #694): eight fuzz targets currently shipping
  # (fuzz_config_toml, fuzz_dnssec_verify, fuzz_doh2_framing,
  # fuzz_nsec3_hash, fuzz_parse_edns, fuzz_parse_message,
  # fuzz_tsig_verify, fuzz_zone_parser).  60 s/target × 8 targets ≈ 480 s
  # of fuzz work; the cargo-fuzz install (cached below) adds ≤ 30 s on
  # cache hit and ≤ 120 s on cold cache.  Total wall-clock stays
  # comfortably under the 10-minute budget required by AC.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust nightly
        id: rust-nightly
        uses: dtolnay/rust-toolchain@nightly
      # Cache the cargo-fuzz binary across runs (rmp #694).  Without
      # caching, every PR pays the full `cargo install cargo-fuzz`
      # latency (≥ 60 s, can spike past 120 s when the nightly toolchain
      # rotates and pulls a fresh transitive dep set).  The cache key
      # includes the runner OS and the nightly toolchain identifier so
      # binaries built against an incompatible toolchain are not
      # restored; the restore-keys fallback still lets a near-match
      # binary be reused when a precise match is not available.
      - name: Cache cargo-fuzz binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-nightly-${{ steps.rust-nightly.outputs.cachekey }}
          restore-keys: |
            cargo-fuzz-${{ runner.os }}-nightly-
            cargo-fuzz-${{ runner.os }}-
      - name: Install cargo-fuzz (cache miss only)
        # Cache hit path: cargo-fuzz is already on the PATH; this step
        # is a no-op courtesy of the `command -v` guard.  Cache miss
        # path: `cargo install cargo-fuzz` is invoked.  cargo-fuzz can
        # fail to compile against arbitrary nightly toolchains (its
        # Cargo.lock pins deps that may not resolve on the runner's
        # nightly), so we drop `--locked` and keep `continue-on-error`
        # to degrade gracefully into a no-op fuzz step (the loop below
        # handles a missing `cargo fuzz` by short-circuiting on empty
        # target list).
        run: |
          if command -v cargo-fuzz >/dev/null 2>&1; then
            echo "cargo-fuzz already installed (cache hit): $(cargo-fuzz --version 2>/dev/null || echo unknown)"
          else
            cargo install cargo-fuzz
          fi
        continue-on-error: true
      - name: Fuzz smoke — all targets (60 s each)
        # RESIDUAL (rmp #694, AC step 4): remove `continue-on-error`
        # below after a 3-PR validation window confirms no spurious
        # crashes on the seeded corpora.  Until then, fuzz crashes
        # surface as workflow warnings rather than blocking the merge.
        # See docs/process/ci-tiers.md.
        run: |
          if ! command -v cargo-fuzz >/dev/null 2>&1; then
            echo "::warning::cargo-fuzz not installed; skipping fuzz smoke."
            exit 0
          fi
          for target in $(cargo fuzz list 2>/dev/null || echo ""); do
            echo "Fuzzing $target for 60 seconds..."
            cargo fuzz run "$target" -- -max_total_time=60 -error_exitcode=1
          done
        continue-on-error: true  # Smoke fuzz failures are advisory in Tier 2.

  # ── ENG-056: loom model-checking tests ───────────────────────────────────
  # Runs on crates marked as concurrency-sensitive (heimdall-runtime: drain
  # counter, cache shard atomic state, ArcSwap-based RunningState container).
  # Requires nightly for loom's exhaustive exploration model.
  #
  # Sprint 60 #648: blocking. A data race or missed memory-ordering
  # regression in the lock-free hot path now fails CI before merge.
  # Loom budget is bounded by LOOM_MAX_PREEMPTIONS (default 3) so the job
  # completes in well under the Tier-2 budget.
  loom:
    name: loom
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--cfg loom"
      LOOM_MAX_PREEMPTIONS: "3"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: cargo test (loom, concurrency-sensitive crates)
        run: cargo test --locked -p heimdall-runtime --test '*' -- loom

  # ── ENG-057: benchmark regression detection ───────────────────────────────
  # Runs criterion benchmarks and compares against stored baselines.
  # A regression exceeding the configured threshold fails the build.
  bench-regression:
    name: bench regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for baseline comparison.
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@stable
      - name: Run criterion benchmarks
        run: cargo bench --locked 2>&1 | tee bench-output.txt
        continue-on-error: true  # No benchmarks yet; remove once added.
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: target/criterion/
        if: always()
